<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contas a Pagar Ambev · Fera Logística</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root { --bg:#0f1419; --card:#1a2332; --card-hover:#223044; --accent:#f5c518; --success:#3dd68c; --danger:#ff5c5c; --text:#e8eef6; --muted:#8b9bb4; --border:#2a3a50; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); padding:24px; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; flex-wrap:wrap; gap:16px; }
  h1 { font-size:1.8rem; } h1 span { color:var(--accent); }
  .subtitle { color:var(--muted); font-size:0.95rem; }
  .filters { display:flex; gap:10px; flex-wrap:wrap; }
  .filters button { background:var(--card); border:1px solid var(--border); color:var(--text); padding:8px 16px; border-radius:20px; cursor:pointer; font-size:0.9rem; }
  .filters button.active, .filters button:hover { background:var(--accent); color:#000; border-color:var(--accent); }
  .kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin-bottom:28px; }
  .kpi { background:var(--card); border-radius:14px; padding:20px; border:1px solid var(--border); }
  .kpi .label { color:var(--muted); font-size:0.85rem; text-transform:uppercase; }
  .kpi .value { font-size:1.8rem; font-weight:700; margin-top:6px; }
  .kpi .value.positive { color:var(--success); } .kpi .value.negative { color:var(--danger); } .kpi .value.accent { color:var(--accent); }
  .charts { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:28px; }
  @media (max-width:900px) { .charts { grid-template-columns:1fr; } }
  .chart-card { background:var(--card); border-radius:14px; padding:20px; border:1px solid var(--border); }
  .chart-card h3 { margin-bottom:12px; }
  table { width:100%; border-collapse:collapse; background:var(--card); border-radius:14px; overflow:hidden; border:1px solid var(--border); }
  th, td { padding:12px 16px; text-align:left; }
  th { background:#15202b; color:var(--muted); font-weight:600; font-size:0.85rem; text-transform:uppercase; }
  tr:nth-child(even) { background:#16202c; } tr:hover { background:var(--card-hover); }
  .status { display:inline-block; padding:4px 10px; border-radius:12px; font-size:0.8rem; font-weight:600; }
  .status.avencer { background:#3a2a00; color:var(--accent); }
  .status.pago { background:#0a3d2a; color:var(--success); }
  .status.credito { background:#3d1a1a; color:var(--danger); }
  .revenda-badge { background:#2a3a50; padding:4px 10px; border-radius:8px; font-size:0.8rem; }
  .pivot-table th, .pivot-table td { text-align:right; }
  .pivot-table th:first-child, .pivot-table td:first-child { text-align:left; }
  .pivot-table .total { font-weight:700; background:#15202b; }
  .pivot-table .row-total { font-weight:700; }
  footer { margin-top:32px; text-align:center; color:var(--muted); font-size:0.85rem; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Contas a Pagar <span>Ambev</span></h1>
    <div class="subtitle">Fera Logística · Atualizado em 28/10/2026 13:02</div>
  </div>
  <div class="filters" id="filters">
    <button class="active" data-filter="all">Todas</button>
    <button data-filter="PONTES E LACERDA">Pontes e Lacerda</button>
    <button data-filter="COLNIZA">Colniza</button>
    <button data-filter="COMODORO">Comodoro</button>
    <button data-filter="JUINA">Juína</button>
  </div>
</header>
<div class="kpi-grid" id="kpis"></div>
<div class="charts">
  <div class="chart-card"><h3>Valores a Pagar por Revenda</h3><canvas id="chartRevenda"></canvas></div>
  <div class="chart-card">
    <h3>Valores por Vencimento × Revenda</h3>
    <div style="overflow-x:auto;"><table class="pivot-table"><thead id="pivotHead"></thead><tbody id="pivotBody"></tbody></table></div>
  </div>
</div>
<div style="overflow-x:auto;">
  <table>
    <thead><tr><th>Revenda</th><th>Referência</th><th>Vencimento</th><th>Situação</th><th>Valor Atualizado</th><th>Texto</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>
<footer>Dashboard automático · Fera Logística</footer>
<script>
const rawData = [{"revenda": "", "ref": "", "venc": "03/11/2026", "situacao": "", "valor": 89103.58, "texto": "Transf.doc.fatmto. FERA LOGIS"}, {"revenda": "", "ref": "", "venc": "04/11/2026", "situacao": "", "valor": 91593.94, "texto": "Transf.doc.fatmto. FERA LOGIS"}, {"revenda": "", "ref": "", "venc": "02/11/2026", "situacao": "", "valor": 142948.03, "texto": "Transf.doc.fatmto. FERA LOGIS"}, {"revenda": "", "ref": "", "venc": "30/10/2026", "situacao": "", "valor": 99152.0, "texto": "Transf.doc.fatmto. FERA LOGIS"}, {"revenda": "", "ref": "", "venc": "03/11/2026", "situacao": "", "valor": 184579.47, "texto": "Transf.doc.fatmto. FERA LOGIS"}, {"revenda": "", "ref": "", "venc": "27/10/2026", "situacao": "", "valor": 243736.47, "texto": "Transf.doc.fatmto. FERA LOGIS"}, {"revenda": "", "ref": "", "venc": "04/11/2026", "situacao": "", "valor": 94988.7, "texto": "Transf.doc.fatmto. FERA LOGIS"}, {"revenda": "", "ref": "", "venc": "29/10/2026", "situacao": "", "valor": 183586.27, "texto": "Transf.doc.fatmto. FERA LOGIS"}, {"revenda": "", "ref": "", "venc": "02/11/2026", "situacao": "", "valor": 73072.87, "texto": "Transf.doc.fatmto. FERA LOGIS"}, {"revenda": "", "ref": "", "venc": "02/11/2026", "situacao": "", "valor": 12869.43, "texto": "Transf.doc.fatmto. FERA LOGIS"}, {"revenda": "", "ref": "", "venc": "30/10/2026", "situacao": "", "valor": 181973.33, "texto": "Transf.doc.fatmto. FERA/PONTE"}, {"revenda": "", "ref": "", "venc": "03/11/2026", "situacao": "", "valor": 187118.86, "texto": "Transf.doc.fatmto. FERA/PONTE"}, {"revenda": "", "ref": "", "venc": "02/11/2026", "situacao": "", "valor": 18136.39, "texto": "Transf.doc.fatmto. FERA/PONTE"}, {"revenda": "", "ref": "", "venc": "30/10/2026", "situacao": "", "valor": 222381.13, "texto": "Transf.doc.fatmto. FERA/PONTE"}, {"revenda": "", "ref": "", "venc": "02/11/2026", "situacao": "", "valor": 161838.58, "texto": "Transf.doc.fatmto. FERA/PONTE"}, {"revenda": "", "ref": "", "venc": "03/11/2026", "situacao": "", "valor": 277904.53, "texto": "Transf.doc.fatmto. FERA/PONTE"}];
const fmt = (v) => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
function statusClass(s) { if (s.includes('A Vencer')) return 'avencer'; if (s === 'Pago') return 'pago'; return 'credito'; }
let currentFilter = 'all';
let chartRevenda;
function filterData() { return currentFilter === 'all' ? rawData : rawData.filter(d => d.revenda === currentFilter); }
function updateKPIs(data) {
  const totalAPagar = data.filter(d => d.valor > 0 && d.situacao !== 'Pago').reduce((s,d) => s + d.valor, 0);
  const totalPago = data.filter(d => d.situacao === 'Pago').reduce((s,d) => s + d.valor, 0);
  const creditos = data.filter(d => d.valor < 0).reduce((s,d) => s + d.valor, 0);
  const pendentes = data.filter(d => d.situacao.includes('A Vencer')).length;
  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><div class="label">Total a Pagar (Pendentes)</div><div class="value accent">${fmt(totalAPagar)}</div></div>
    <div class="kpi"><div class="label">Já Pago</div><div class="value positive">${fmt(totalPago)}</div></div>
    <div class="kpi"><div class="label">Créditos / A Receber</div><div class="value ${creditos < 0 ? 'negative' : ''}">${fmt(Math.abs(creditos))}</div></div>
    <div class="kpi"><div class="label">Títulos Pendentes</div><div class="value">${pendentes}</div></div>`;
}
function updateTable(data) {
  document.getElementById('tbody').innerHTML = data.sort((a,b) => a.venc.split('/').reverse().join('-').localeCompare(b.venc.split('/').reverse().join('-'))).map(d => `
    <tr>
      <td><span class="revenda-badge">${d.revenda}</span></td>
      <td>${d.ref}</td><td>${d.venc}</td>
      <td><span class="status ${statusClass(d.situacao)}">${d.situacao}</span></td>
      <td style="font-weight:600;color:${d.valor < 0 ? 'var(--danger)' : 'var(--text)'}">${fmt(d.valor)}</td>
      <td style="color:var(--muted);font-size:0.85rem">${d.texto}</td>
    </tr>`).join('');
}
function updateCharts(data) {
  const byRevenda = {};
  data.filter(d => d.valor > 0 && d.situacao !== 'Pago').forEach(d => byRevenda[d.revenda] = (byRevenda[d.revenda] || 0) + d.valor);
  if (chartRevenda) chartRevenda.destroy();
  chartRevenda = new Chart(document.getElementById('chartRevenda'), {
    type: 'bar',
    data: { labels: Object.keys(byRevenda), datasets: [{ data: Object.values(byRevenda), backgroundColor: '#f5c518', borderRadius: 6 }] },
    options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { ticks: { callback: v => fmt(v), color: '#8b9bb4' }, grid: { color: '#2a3a50' } }, x: { ticks: { color: '#8b9bb4' }, grid: { display: false } } } }
  });
  const revendas = ['COLNIZA','COMODORO','JUINA','PONTES E LACERDA'];
  const pendentes = data.filter(d => d.valor > 0 && d.situacao !== 'Pago');
  const byDate = {};
  pendentes.forEach(d => { if (!byDate[d.venc]) byDate[d.venc] = {}; byDate[d.venc][d.revenda] = (byDate[d.venc][d.revenda] || 0) + d.valor; });
  const dates = Object.keys(byDate).sort((a,b) => a.split('/').reverse().join('-').localeCompare(b.split('/').reverse().join('-')));
  document.getElementById('pivotHead').innerHTML = `<tr><th>Vencimento</th>${revendas.map(r => `<th>${r}</th>`).join('')}<th>Total Geral</th></tr>`;
  let colTotals = Object.fromEntries(revendas.map(r => [r, 0]));
  let grandTotal = 0;
  const rows = dates.map(date => {
    let rowTotal = 0;
    const cells = revendas.map(r => { const v = byDate[date][r] || 0; rowTotal += v; colTotals[r] += v; return `<td>${v ? fmt(v) : '—'}</td>`; }).join('');
    grandTotal += rowTotal;
    return `<tr><td>${date}</td>${cells}<td class="row-total">${fmt(rowTotal)}</td></tr>`;
  }).join('');
  document.getElementById('pivotBody').innerHTML = rows + `<tr class="total"><td>Total Geral</td>${revendas.map(r => `<td>${fmt(colTotals[r])}</td>`).join('')}<td>${fmt(grandTotal)}</td></tr>`;
}
function refresh() { const data = filterData(); updateKPIs(data); updateTable(data); updateCharts(data); }
document.getElementById('filters').addEventListener('click', e => {
  if (e.target.tagName !== 'BUTTON') return;
  document.querySelectorAll('#filters button').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  currentFilter = e.target.dataset.filter;
  refresh();
});
refresh();
</script>
</body>
</html>
